<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experimentos · HyperNCD + Sonata (Catedral de Lima)</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --linea:#dfe3e8; --txt:#1c2430; --suave:#667085; --acento:#2563eb; --cambia:#fff3c4; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  header { background:#111827; color:#fff; padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header small { color:#9ca3af; }
  nav { display:flex; gap:6px; margin-left:auto; }
  nav button { background:#1f2937; color:#d1d5db; border:0; padding:7px 14px; border-radius:6px; cursor:pointer; font-weight:600; }
  nav button.on { background:var(--acento); color:#fff; }
  nav button .n { opacity:.7; font-weight:400; margin-left:4px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:16px; padding:16px 20px; max-width:1500px; margin:auto; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .lista { display:flex; flex-direction:column; gap:8px; align-content:start; }
  .tarjeta { background:var(--card); border:1px solid var(--linea); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .tarjeta:hover { border-color:#93a3b8; }
  .tarjeta.sel { border-color:var(--acento); box-shadow:0 0 0 2px #dbe6ff; }
  .tarjeta h3 { margin:0 0 4px; font-size:13px; }
  .meta { color:var(--suave); font-size:12px; }
  .cmp { float:right; font-size:12px; color:var(--suave); }
  .chips span { display:inline-block; background:#eef2f7; border-radius:10px; padding:1px 8px; margin:3px 4px 0 0; font-size:11px; cursor:pointer; }
  .panel { background:var(--card); border:1px solid var(--linea); border-radius:8px; padding:16px 18px; min-width:0; }
  .panel h2 { margin:0 0 4px; font-size:18px; }
  .panel h4 { margin:18px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--suave); }
  table { border-collapse:collapse; width:100%; }
  td, th { text-align:left; padding:4px 8px; border-bottom:1px solid #eef0f3; vertical-align:top; }
  th { color:var(--suave); font-weight:500; width:34%; }
  td.dif { background:var(--cambia); }
  .nulo { color:#b45309; font-style:italic; }
  .imgs { display:flex; flex-wrap:wrap; gap:10px; }
  .imgs a img { height:150px; border:1px solid var(--linea); border-radius:4px; display:block; }
  .btn { background:var(--acento); color:#fff; border:0; border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; margin:2px 6px 2px 0; text-decoration:none; display:inline-block; }
  .btn.sec { background:#e5e9f0; color:#1c2430; }
  .visores { display:grid; gap:10px; margin-top:8px; }
  .visores.dos { grid-template-columns:1fr 1fr; }
  iframe { width:100%; height:600px; border:1px solid var(--linea); border-radius:6px; background:#fff; }
  .barra { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .aviso { background:#fff8e1; border:1px solid #f0d78a; border-radius:6px; padding:8px 12px; font-size:12px; margin:8px 0; }
  .vacio { color:var(--suave); padding:30px; text-align:center; }
  .linaje { font-family:ui-monospace,Consolas,monospace; font-size:12px; background:#f3f5f8; padding:8px 10px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>Experimentos · HyperNCD + Sonata</h1><small>Catedral de Lima · lee <code>experimentacion/registro/</code></small>
  <nav id="tabs"></nav>
</header>
<main>
  <section class="lista" id="lista"></section>
  <section class="panel" id="detalle"><div class="vacio">Elige un experimento de la lista.</div></section>
</main>

<script src="../registro/indice.js"></script>
<script>
const RAIZ = "../../";                       // este archivo vive en experimentacion/visor/
const href = p => RAIZ + p;
const $ = id => document.getElementById(id);
const exps = INDICE.experimentos;
const porId = Object.fromEntries(exps.map(e => [e.id, e]));
let etapa = INDICE.etapas.find(t => exps.some(e => e.etapa === t));
let actual = null;
let comparar = [];                           // ids marcados (maximo 2)

const fmt = v => (v === null || v === undefined) ? '<span class="nulo">sin medir</span>'
  : (typeof v === 'object' ? esc(JSON.stringify(v)) : esc(String(v)));
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function pestanas() {
  $('tabs').innerHTML = INDICE.etapas.map(t => {
    const n = exps.filter(e => e.etapa === t).length;
    return `<button class="${t===etapa?'on':''}" data-t="${t}">${t}<span class="n">${n}</span></button>`;
  }).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { etapa = b.dataset.t; actual = null; pintar(); });
}

function lista() {
  const grupo = exps.filter(e => e.etapa === etapa);
  $('lista').innerHTML = grupo.length ? grupo.map(e => `
    <div class="tarjeta ${actual===e.id?'sel':''}" data-id="${e.id}">
      <label class="cmp" onclick="event.stopPropagation()"><input type="checkbox" data-c="${e.id}" ${comparar.includes(e.id)?'checked':''}> comparar</label>
      <h3>${esc(e.titulo)}</h3>
      <div class="meta">${e.fecha} · ${esc(e.estado)} · ${esc(e.hardware)}</div>
      <div class="chips">${e.entradas.map(i => `<span data-ir="${i}">← ${i}</span>`).join('')}</div>
    </div>`).join('') : `<div class="vacio">Sin experimentos en ${etapa} todavía.</div>`;
  $('lista').querySelectorAll('.tarjeta').forEach(t => t.onclick = () => { actual = t.dataset.id; pintar(); });
  $('lista').querySelectorAll('[data-ir]').forEach(c => c.onclick = ev => { ev.stopPropagation(); ir(c.dataset.ir); });
  $('lista').querySelectorAll('[data-c]').forEach(c => c.onchange = () => {
    const id = c.dataset.c;
    comparar = c.checked ? [...comparar, id].slice(-2) : comparar.filter(x => x !== id);
    pintar();
  });
}

function ir(id) { etapa = porId[id].etapa; actual = id; pintar(); }

function linaje(e, prof = 0) {
  return e.entradas.map(i => `${'&nbsp;&nbsp;'.repeat(prof)}└ <a href="#" data-ir="${i}">${i}</a> <span class="meta">(${porId[i]?.etapa||'?'})</span><br>${porId[i] ? linaje(porId[i], prof+1) : ''}`).join('');
}

function filas(obj, otro, clave) {
  const ks = [...new Set([...Object.keys(obj||{}), ...Object.keys(otro||{})])];
  return ks.map(k => {
    const a = obj ? obj[k] : undefined, b = otro ? otro[k] : undefined;
    const dif = otro && JSON.stringify(a) !== JSON.stringify(b);
    return `<tr><th>${esc(k)}</th><td class="${dif?'dif':''}">${a === undefined ? '—' : fmt(a)}</td></tr>`;
  }).join('') || '<tr><td colspan="2" class="meta">—</td></tr>';
}

function detalle() {
  if (comparar.length === 2) return vistaComparar(porId[comparar[0]], porId[comparar[1]]);
  const e = actual && porId[actual];
  if (!e) { $('detalle').innerHTML = `<div class="vacio">Elige un experimento de la lista${comparar.length?' o marca otro para comparar':''}.<br><span class="meta">Marca "comparar" en dos tarjetas (de cualquier etapa) para verlos lado a lado.</span></div>`; return; }
  const r = e.resultados || {};
  $('detalle').innerHTML = `
    <h2>${esc(e.titulo)}</h2>
    <div class="meta"><code>${e.id}</code> · ${e.etapa} · ${e.fecha} · ${esc(e.estado)} · ${esc(e.hardware)}</div>
    <p>${esc(e.descripcion)}</p>
    ${e.notas ? `<div class="aviso">${esc(e.notas)}</div>` : ''}
    ${e.entradas.length ? `<h4>De dónde viene</h4><div class="linaje">${esc(e.id)}<br>${linaje(e)}</div>` : ''}
    <h4>Parámetros</h4><table>${filas(e.parametros)}</table>
    <h4>Métricas</h4><table>${filas(e.metricas)}</table>
    <h4>Costo computacional</h4><table>${filas(e.costo)}</table>
    <h4>Resultados</h4>
    ${r.documento ? `<a class="btn sec" href="${href(r.documento)}" target="_blank">Documento</a>` : ''}
    ${(r.json||[]).map(j => `<a class="btn sec" href="${href(j)}" target="_blank">${esc(j.split('/').pop())}</a>`).join('')}
    ${(r.imagenes||[]).length ? `<div class="imgs" style="margin-top:8px">${r.imagenes.map(i => `<a href="${href(i)}" target="_blank"><img loading="lazy" src="${href(i)}" alt=""></a>`).join('')}</div>` : ''}
    ${(r.visores||[]).length ? `<h4>Visores 3D (se cargan al pulsar)</h4>${r.visores.map((v,i) => `<button class="btn" data-v="${esc(v)}">${esc(v.split('/').pop())}</button>`).join('')}<div class="visores" id="vis"></div>` : ''}
    <h4>Datos pesados (no están en git)</h4>
    <table>${(e.datos_pesados||[]).map(d => `<tr><th>${esc(d.que)}</th><td>${esc(d.donde)}</td></tr>`).join('') || '<tr><td class="meta">—</td></tr>'}</table>`;
  $('detalle').querySelectorAll('[data-ir]').forEach(a => a.onclick = ev => { ev.preventDefault(); ir(a.dataset.ir); });
  $('detalle').querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    $('vis').innerHTML = `<iframe src="${href(b.dataset.v)}" title="visor"></iframe>`;   // carga solo uno a la vez
  });
}

function vistaComparar(a, b) {
  const seccion = (titulo, campo) => `<h4>${titulo}</h4><table>
    <tr><th></th><th>${esc(a.id)}</th><th>${esc(b.id)}</th></tr>
    ${[...new Set([...Object.keys(a[campo]||{}), ...Object.keys(b[campo]||{})])].map(k => {
      const x = (a[campo]||{})[k], y = (b[campo]||{})[k], dif = JSON.stringify(x) !== JSON.stringify(y);
      return `<tr><th>${esc(k)}</th><td class="${dif?'dif':''}">${x===undefined?'—':fmt(x)}</td><td class="${dif?'dif':''}">${y===undefined?'—':fmt(y)}</td></tr>`;
    }).join('') || '<tr><td colspan="3" class="meta">—</td></tr>'}</table>`;
  const col = e => `<div><b>${esc(e.titulo)}</b><div class="meta">${e.etapa} · ${e.fecha} · ${esc(e.hardware)}</div>
    <div class="imgs" style="margin-top:6px">${(e.resultados.imagenes||[]).map(i => `<a href="${href(i)}" target="_blank"><img loading="lazy" src="${href(i)}" alt="" style="height:130px"></a>`).join('')}</div>
    ${(e.resultados.visores||[]).map(v => `<button class="btn" data-vc="${esc(v)}" data-lado="${e.id}">${esc(v.split('/').pop())}</button>`).join('')}</div>`;
  $('detalle').innerHTML = `
    <div class="barra"><h2 style="margin:0">Comparar</h2><button class="btn sec" id="salir">Salir de comparar</button></div>
    <div class="meta">Las celdas amarillas son los valores que difieren.</div>
    ${seccion('Parámetros','parametros')}${seccion('Métricas','metricas')}${seccion('Costo computacional','costo')}
    <h4>Resultados</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${col(a)}${col(b)}</div>
    <div class="visores dos" id="vis2"></div>
    <div class="aviso">Los visores 3D cargan muchos puntos. En una laptop con poca memoria abre uno a la vez.</div>`;
  $('salir').onclick = () => { comparar = []; pintar(); };
  const abiertos = {};
  $('detalle').querySelectorAll('[data-vc]').forEach(btn => btn.onclick = () => {
    abiertos[btn.dataset.lado] = btn.dataset.vc;
    $('vis2').innerHTML = Object.values(abiertos).map(v => `<iframe src="${href(v)}" title="visor"></iframe>`).join('');
  });
}

function pintar() { pestanas(); lista(); detalle(); }
pintar();
</script>
</body>
</html>
